; ATtiny85 POV sword. The sketch folder itself is the source dir, so the same
; files still open and build in the Arduino IDE (ATTinyCore, ATtiny85, 8 MHz internal).

[platformio]
src_dir = .
default_envs = attiny85

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino          ; ATTinyCore on atmelavr
board_build.f_cpu = 8000000L ; must match lfuse below (millis/micros depend on it)
; Only the top-level sources: not test/host/ or .pio/.
build_src_filter = -<*> +<*.ino> +<*.cpp>

; Fuses, written with `pio run -t fuses` (needs the ISP programmer below):
;   lfuse 0xE2  8 MHz internal RC, no CKDIV8
;   hfuse 0xD7  SPIEN on, EESAVE on (reflashing keeps the received image),
;               BOD off, RSTDISBL NOT set: PB5 stays RESET so ISP keeps working
;   efuse 0xFF
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD7
board_fuses.efuse = 0xFF

; ISP programmer. USBasp:
upload_protocol = usbasp
upload_flags = -B 8          ; slow SCK, safe for a 1 MHz (factory-fresh) chip
; Arduino as ISP instead:
;upload_protocol = stk500v1
;upload_port = /dev/cu.usbmodem*
;upload_speed = 19200
;upload_flags = -P$UPLOAD_PORT -b$UPLOAD_SPEED
